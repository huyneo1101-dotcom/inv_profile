<html lang="vi">
<head>

<style>
  :root{
    --bg:#0b0e14; --panel:#141a26; --panel2:#1b2333; --line:#26304a;
    --text:#e7ecf5; --muted:#94a0b8; --orange:#f7931a;

  *{box-sizing:border-box}

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;

  .lamp.yellow{background:radial-gradient(circle at 35% 30%,#ffdd85,#d9a021);box-shadow:0 0 34px rgba(242,193,78,.5),0 0 0 6px rgba(242,193,78,.12)}

  .gauge{height:6px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));position:relative}
  .gauge > i{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px;transform:translateX(-50%)}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

  .slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);

  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:2.5px;
    background:#8a94ab;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:rgba(239,83,80,.35);border-color:var(--red)}
  .switch input:checked + .slider:before{transform:translateX(21px);background:var(--red)}
  textarea{width:100%;margin-top:10px;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;resize:vertical;min-height:38px}
  textarea::placeholder{color:#6b768f}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  .badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;

  .btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);

  /* Tabs */
  .tabbar{display:flex;gap:8px;margin:0 0 16px}

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const LS_KEY = 'btc-tin-hieu:v1';
const CG_CHART   = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily';
const FNG_URL    = 'https://api.alternative.me/fng/?limit=1';
const FUND_URL   = 'https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT';

/* ---------- helpers ---------- */
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
function fetchJSON(p){ return fetch(p+'?t='+Date.now(), {cache:'no-store'}); }  /* cache-bust: web luon lay data moi */
function fmtUSD(n){ return (n==null||isNaN(n)) ? '—' : '$'+Math.round(n).toLocaleString('en-US'); }
function computeEMA(prices, period){
  if(!prices || prices.length < period) return null;
  const k = 2/(period+1);
  let ema = prices.slice(0,period).reduce((a,b)=>a+b,0)/period;
  for(let i=period;i<prices.length;i++) ema = prices[i]*k + ema*(1-k);
  return ema;
}
function computeRSI(prices, period){
  period = period||14;
  if(!prices || prices.length < period+1) return null;
  let avgG=0, avgL=0;
  for(let i=1;i<=period;i++){ const d=prices[i]-prices[i-1]; if(d>=0) avgG+=d; else avgL-=d; }
  avgG/=period; avgL/=period;
  for(let i=period+1;i<prices.length;i++){
    const d=prices[i]-prices[i-1];
    avgG=(avgG*(period-1)+Math.max(d,0))/period;
    avgL=(avgL*(period-1)+Math.max(-d,0))/period;
  }
  if(avgL===0) return 100;
  return 100 - 100/(1+avgG/avgL);
}
function trendOf(price, e50, e200){
  if(price==null || e50==null || e200==null) return null;
  if(price > e50 && price > e200) return 'above_both';
  if(price < e50 && price < e200) return 'below_both';
  return 'mixed';
}
function daysToNextFOMC(meetings){
  if(!meetings || !meetings.length) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  let best = null;
  for(const m of meetings){
    const diff = Math.round((new Date(m.date+'T00:00:00') - today)/86400000);
    if(diff >= 0 && (best==null || diff < best.days)) best = {days:diff, meeting:m};
  }
  return best;
}

/* ---------- tính điểm thận trọng ---------- */
const MAX_SCORE = 14;
function computeScore(s){
  const { trend, fomc, rsi, fng, funding, etf, mstr, mvrv, macro } = s;
  let score = 0; const F = [];
  const add = (w,c,l,d)=>{ score+=w; F.push({w,c,l,d}); };

  if(trend === 'below_both') add(2,'red','Giá dưới cả EMA50 & EMA200','Xu hướng ngắn–trung hạn đang yếu (đà giảm chưa đảo chiều).');
  else if(trend === 'mixed') add(1,'yellow','Giá nằm giữa EMA50 và EMA200','Xu hướng chưa rõ ràng, đang giằng co.');
  else if(trend === 'above_both') add(0,'green','Giá trên cả EMA50 & EMA200','Cấu trúc xu hướng đang tích cực.');

  if(fomc){
    if(fomc.days <= 3) add(2,'red','Sát cuộc họp Fed (còn '+fomc.days+' ngày)','Quanh ngày Fed công bố, giá dễ chao đảo mạnh — cả hai chiều.');
    else if(fomc.days <= 7) add(1,'yellow','Gần cuộc họp Fed (còn '+fomc.days+' ngày)','Bắt đầu vào vùng nhạy cảm trước quyết định lãi suất.');
  }
  if(rsi!=null){
    if(rsi >= 70) add(1,'red','RSI cao ('+rsi.toFixed(0)+') — quá mua','Giá đã tăng nóng, dễ điều chỉnh — không nên đuổi giá.');
    else if(rsi <= 30) add(0,'green','RSI thấp ('+rsi.toFixed(0)+') — quá bán','Giá đã giảm sâu, thường là vùng gom hàng dần.');
  }
  if(fng && fng.value!=null){
    if(fng.value >= 75) add(1,'red','Tâm lý "Tham lam tột độ" ('+fng.value+')','Đám đông đang hưng phấn — lúc rủi ro điều chỉnh cao nhất.');
    else if(fng.value <= 25) add(0,'green','Tâm lý "Sợ hãi tột độ" ('+fng.value+')','Đám đông đang hoảng — thường là lúc mua tốt hơn là bán.');
  }
  if(funding && funding.rate!=null){
    const pct = funding.rate*100;
    if(funding.rate >= 0.0005) add(1,'red','Funding cao ('+pct.toFixed(3)+'%/8h)','Đòn bẩy long quá đông — dễ bị "long squeeze" (rớt nhanh).');
    else if(funding.rate < 0) add(0,'green','Funding âm ('+pct.toFixed(3)+'%/8h)','Phe long không quá đông — ít rủi ro bị đè.');
  }
  if(etf.active) add(1,'red','Dòng ETF đang rút ra'+(etf.auto?'':' (bạn tự bật)'),
    etf.auto ? ('Quỹ ETF bán ròng '+etf.streak+' phiên liền — thiếu lực mua đỡ giá.') : 'Tiền quỹ lớn đang bán/đứng ngoài — thiếu lực mua đỡ giá.');
  if(mstr) add(1,'red','MicroStrategy vừa bán lớn (bạn tự bật)','Tay chơi hay gom mua bất ngờ bán ra — tín hiệu bất thường.');

  if(mvrv!=null){
    if(mvrv >= 7) add(2,'red','MVRV Z-score rất cao ('+mvrv.toFixed(1)+')','Giá đang cao hơn nhiều so với giá vốn toàn mạng — vùng đỉnh lịch sử, rủi ro rất lớn.');
    else if(mvrv >= 5) add(1,'red','MVRV Z-score cao ('+mvrv.toFixed(1)+')','Giá đã vượt xa giá vốn trung bình — vùng định giá nóng.');
    else if(mvrv < 0.1) add(0,'green','MVRV Z-score thấp ('+mvrv.toFixed(1)+')','Giá quanh/dưới giá vốn toàn mạng — vùng đáy lịch sử, thường là cơ hội gom.');
  }
  if(macro){
    const y = macro.us10y, d = macro.dxy, m = macro.m2;
    if(y && y.trend==='up' && y.chg20>=0.3) add(1,'red','Lợi suất 10Y tăng nhanh ('+y.value+'%)','Lãi suất dài hạn lên — siết thanh khoản, bất lợi cho tài sản rủi ro như BTC.');
    if(d && d.trend==='up' && d.chg20>=1.5) add(1,'red','Đồng đô mạnh lên (chỉ số '+d.value+')','Đô mạnh thường đè giá tài sản rủi ro và crypto.');
    if(m && m.trend==='down') add(1,'red','Cung tiền M2 co lại','Thanh khoản toàn hệ thống thu hẹp — thiếu "tiền mới" đẩy giá.');
    else if(m && m.trend==='up') add(0,'green','Cung tiền M2 đang nới','Thanh khoản mở rộng — nền thuận lợi hơn cho tài sản rủi ro.');
  }

  let level, color, guide;
  if(score <= 3){ level='Thoáng'; color='green';
    guide='Ít tín hiệu cản trở. Môi trường tương đối bình thường — vẫn nên mua chia nhỏ theo kế hoạch, đừng dồn một lần.'; }
  else if(score <= 7){ level='Cần chú ý'; color='yellow';
    guide='Có vài tín hiệu thận trọng. Cân nhắc chia nhỏ lệnh mua, giữ một phần tiền mặt dự phòng, đừng vội.'; }
  else { level='Rất thận trọng'; color='red';
    guide='Nhiều tín hiệu cùng xuất hiện. Ưu tiên chia nhỏ, không dồn tiền, chờ thị trường rõ ràng hơn trước khi mua mạnh.'; }
  return { score, factors:F, level, color, guide };
}

/* Rủi ro định giá LIVE — khớp backtest.py v3 (percentile lịch sử qua breakpoints). */
function pctFromBp(v, bp){
  if(!bp || v==null) return null;
  if(v <= bp[0]) return 0;
  if(v >= bp[bp.length-1]) return 100;
  for(let k=0;k<bp.length-1;k++){
    if(v < bp[k+1]){ const span=bp[k+1]-bp[k]; return k + (span ? (v-bp[k])/span : 0); }
  }
  return 100;
}
function liveRisk(core, price, e200, rsi, mvrv, fngVal){
  if(!core || !core.risk || !core.risk.percentiles) return null;
  const bp = core.risk.percentiles;
  const raw = { mvrvZ:mvrv, fng:fngVal, rsi:rsi, ext:(price!=null && e200)?(price/e200-1):null };
  const parts = [];
  for(const k of ['mvrvZ','fng','rsi','ext']){
    if(raw[k]!=null && bp[k]){ const p=pctFromBp(raw[k],bp[k]); if(p!=null) parts.push({k,p,v:raw[k]}); }
  }
  if(!parts.length) return null;
  const risk = parts.reduce((a,b)=>a+b.p,0)/parts.length;
  return { risk, parts };
}
function coreTier(risk, cutoffs){
  if(!cutoffs || risk==null) return null;
  if(risk <= cutoffs.green_max) return 'Thoang';
  if(risk >= cutoffs.red_min) return 'Rat than trong';
  return 'Can chu y';
}
const COMP_VI = {mvrvZ:'MVRV Z', fng:'Sợ hãi & Tham lam', rsi:'RSI', ext:'Giãn trên EMA200'};

/* Gợi ý DCA cho nhà đầu tư dài hạn: điều tiết liều mua theo ĐỊNH GIÁ (MVRV phân vị).
   Neo vào backtest 1 năm: định giá càng rẻ → 1 năm sau càng hiếm khi giảm. */
function dcaSuggestion(pct, regime){
  if(pct==null) return null;
  let mult, label, color, zone;
  if(pct < 15){ mult=2.0; label='Tăng mua mạnh'; color='var(--green)'; zone='rất rẻ'; }
  else if(pct < 30){ mult=1.5; label='Tăng mua'; color='var(--green)'; zone='rẻ'; }
  else if(pct < 50){ mult=1.2; label='Mua nhỉnh hơn'; color='var(--green)'; zone='hợp lý (thiên rẻ)'; }
  else if(pct < 70){ mult=1.0; label='Mua đều'; color='var(--yellow)'; zone='hợp lý'; }
  else if(pct < 85){ mult=0.6; label='Giảm liều'; color='var(--red)'; zone='hơi đắt'; }
  else { mult=0.3; label='Giãn / tạm dừng'; color='var(--red)'; zone='đắt'; }
  const regNote = regime==='bear'
    ? 'Xu hướng ngắn hạn đang giảm → chia lệnh nhỏ, rải nhiều nhịp trong kỳ (dễ có giá thấp hơn).'
    : regime==='bull'
    ? 'Xu hướng ngắn hạn đang tăng → mua đều theo lịch, không cần chờ giảm sâu.'
    : '';
  return { mult, label, color, zone, regNote };
}
const TIER_VI = {'Thoang':'Thoáng','Can chu y':'Cần chú ý','Rat than trong':'Rất thận trọng'};
const TIER_COLOR = {'Thoang':'var(--green)','Can chu y':'var(--yellow)','Rat than trong':'var(--red)'};

function Spark({data}){
  if(!data || data.length < 2) return null;
  const w=600, h=56, pad=3;
  const min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
  const step=(w-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*step, h-pad-((v-min)/rng)*(h-pad*2)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col = data[data.length-1] >= data[0] ? 'var(--green)' : 'var(--red)';
  return <svg className="spark" viewBox={'0 0 '+w+' '+h} preserveAspectRatio="none">
    <path d={d} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}

/* ---------- app ---------- */
function App(){
  const init = loadState();
  const [mstr, setMstr] = useState(!!init.mstrSelling);
  const [etfManual, setEtfManual] = useState(!!init.etfOutflow);
  const [etfNote, setEtfNote] = useState(init.etfNote||'');
  const [mstrNote, setMstrNote] = useState(init.mstrNote||'');
  const [notify, setNotify] = useState(!!init.notify);
  const [noti, setNoti] = useState(Object.assign({red:true,fed:true,cheap:true,regime:true,dca:false,dcaFreq:7}, init.noti||{}));
  const [dcaBase, setDcaBase] = useState(init.dcaBase||'');
  const [tab, setTab] = useState('signals');

  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [fomc, setFomc] = useState(null);
  const [fng, setFng] = useState(null);
  const [funding, setFunding] = useState(null);
  const [etfData, setEtfData] = useState(null);
  const [mstrData, setMstrData] = useState(null);
  const [mvrv, setMvrv] = useState(null);
  const [macro, setMacro] = useState(null);
  const [backtest, setBacktest] = useState(null);
  const [updatedAt, setUpdatedAt] = useState(null);

  useEffect(()=>{ saveState(Object.assign({}, loadState(),
    {etfOutflow:etfManual,mstrSelling:mstr,etfNote,mstrNote,notify,dcaBase,noti})); },
    [etfManual,mstr,etfNote,mstrNote,notify,dcaBase,noti]);

  useEffect(()=>{ fetchJSON('./data/fomc.json').then(r=>r.json())
    .then(j=>setFomc(daysToNextFOMC(j.meetings))).catch(()=>{}); },[]);
  useEffect(()=>{ fetchJSON('./data/etf.json').then(r=>r.json())
    .then(j=>{ if(j && j.latestNetFlow!=null) setEtfData(j); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetchJSON('./data/mstr.json').then(r=>r.json())
    .then(j=>{ if(j && j.latest8K) setMstrData(j); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetchJSON('./data/onchain.json').then(r=>r.json())
    .then(j=>{ if(j && j.mvrvZscore!=null) setMvrv(j.mvrvZscore); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetchJSON('./data/macro.json').then(r=>r.json())
    .then(j=>{ if(j && (j.dxy||j.us10y||j.m2)) setMacro(j); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetchJSON('./data/backtest.json').then(r=>r.json())
    .then(j=>{ if(j && j.core) setBacktest(j); }).catch(()=>{}); },[]);

  // giá + EMA + RSI (CoinGecko live, fallback file)
  useEffect(()=>{
    let done=false;
    (async()=>{
      try{
        const r = await fetch(CG_CHART);
        if(!r.ok) throw new Error('CoinGecko '+r.status);
        const j = await r.json();
        const prices = (j.prices||[]).map(p=>p[1]).filter(v=>typeof v==='number');
        if(prices.length < 200) throw new Error('thiếu dữ liệu');
        if(!done){
          setData({price:prices[prices.length-1], e50:computeEMA(prices,50), e200:computeEMA(prices,200),
            prev:prices[prices.length-2], rsi:computeRSI(prices,14), history:prices.slice(-90), live:true});
          setUpdatedAt(new Date()); setLoading(false);
        }
        return;
      }catch(e){
        try{
          const j2 = await (await fetchJSON('./data/btc.json')).json();
          if(j2 && j2.price!=null && !done){
            const hp=(j2.history||[]).map(h=>h.price);
            setData({price:j2.price,e50:j2.ema50,e200:j2.ema200,prev:null,
              rsi:computeRSI(hp,14),history:hp,live:false});
            setUpdatedAt(j2.generatedAt?new Date(j2.generatedAt):null);
            setErr('Không lấy được giá trực tiếp — đang dùng dữ liệu dự phòng.');
            setLoading(false); return;
          }
        }catch(e2){}
        if(!done){ setErr('Chưa lấy được dữ liệu giá BTC. Kiểm tra kết nối rồi thử lại.'); setLoading(false); }
      }
    })();
    return ()=>{done=true;};
  },[]);

  useEffect(()=>{ fetch(FNG_URL).then(r=>r.json()).then(j=>{
    const d=j && j.data && j.data[0]; if(d) setFng({value:parseInt(d.value,10),cls:d.value_classification});
  }).catch(()=>{}); },[]);
  useEffect(()=>{ fetch(FUND_URL).then(r=>r.json()).then(j=>{
    if(j && j.lastFundingRate!=null) setFunding({rate:parseFloat(j.lastFundingRate)});
  }).catch(()=>{}); },[]);

  const trend = data ? trendOf(data.price, data.e50, data.e200) : null;
  const etfAutoOutflow = !!(etfData && etfData.outflowStreak >= 2);
  const etf = { active: etfManual || etfAutoOutflow, auto: etfAutoOutflow && !etfManual, streak: etfData?etfData.outflowStreak:0 };
  const result = useMemo(()=>computeScore({trend,fomc,rsi:data?data.rsi:null,fng,funding,etf,mstr,mvrv,macro}),
    [trend,fomc,data,fng,funding,etf.active,etf.auto,etf.streak,mstr,mvrv,macro]);

  useEffect(()=>{
    if(!notify || loading) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    const today = new Date().toISOString().slice(0,10);
    const st = loadState();
    const log = st.notiLog || {};
    const msgs = [];
    if(noti.red && data && result.color==='red' && log.red!==today){ msgs.push('🔴 Mức thận trọng đang ĐỎ'); log.red=today; }
    if(noti.fed && fomc && fomc.days<=2 && log.fed!==today){ msgs.push('🏛️ Sát ngày Fed (còn '+fomc.days+' ngày)'); log.fed=today; }
    const lt = backtest && backtest.core && backtest.core.longterm && backtest.core.longterm.current;
    if(noti.cheap && lt && lt.tier==='Thoang' && log.cheap!==today){ msgs.push('🟢 Định giá dài hạn đang RẺ — vùng gom'); log.cheap=today; }
    const curReg = backtest && backtest.core && backtest.core.current ? backtest.core.current.regime : null;
    if(noti.regime && curReg && st.lastRegime && st.lastRegime!==curReg && log.regime!==today){
      msgs.push('🔀 Regime đổi: '+(st.lastRegime==='bull'?'Tăng':'Giảm')+' → '+(curReg==='bull'?'Tăng':'Giảm')); log.regime=today; }
    let dcaLast = st.dcaLast;
    if(noti.dca){
      const gap = dcaLast ? Math.floor((new Date(today)-new Date(dcaLast))/86400000) : 9999;
      if(gap >= (noti.dcaFreq||7)){ msgs.push('🗓️ Đến kỳ mua định kỳ (DCA)'); dcaLast=today; }
    }
    saveState(Object.assign({}, st, {notiLog:log, lastRegime:curReg||st.lastRegime, dcaLast}));
    if(msgs.length){ try{ new Notification('BTC Tín Hiệu', {body:msgs.join('\n'), icon:'icon.svg'}); }catch(e){} }
  },[notify,noti,loading,data,result,fomc,backtest]);

  const toggleNotify = useCallback(async ()=>{
    if(notify){ setNotify(false); return; }
    if(!('Notification' in window)){ alert('Trình duyệt không hỗ trợ thông báo.'); return; }
    let p = Notification.permission;
    if(p!=='granted') p = await Notification.requestPermission();
    if(p==='granted') setNotify(true); else alert('Bạn chưa cấp quyền thông báo.');
  },[notify]);

  const chg = data && data.prev ? (data.price-data.prev)/data.prev*100 : null;
  const relTag = (v,e)=> e==null||v==null ? '' : (v>=e ? 'up' : 'down');
  const relTxt = (v,e)=> e==null||v==null ? '' : (v>=e ? '▲ trên' : '▼ dưới');
  const barColors = {red:'var(--red)',yellow:'var(--yellow)',green:'var(--green)'};
  const rsiColor = data&&data.rsi!=null ? (data.rsi>=70?'var(--red)':data.rsi<=30?'var(--green)':'var(--text)') : 'var(--muted)';
  const rsiTxt = data&&data.rsi!=null ? (data.rsi>=70?'Quá mua':data.rsi<=30?'Quá bán':'Trung tính') : '';
  const fngColor = fng ? (fng.value>=75?'var(--red)':fng.value<=25?'var(--green)':'var(--text)') : 'var(--muted)';
  const fundPct = funding ? funding.rate*100 : null;
  const fundColor = funding ? (funding.rate>=0.0005?'var(--red)':funding.rate<0?'var(--green)':'var(--text)') : 'var(--muted)';

  return (
    <div className="wrap">
      <header><div className="logo">₿</div><h1>BTC Tín Hiệu</h1></header>
      <div className="sub">Bảng tín hiệu thận trọng — trợ lý ra quyết định mua từ từ, không phải lời khuyên đầu tư.</div>

      <div className="tabbar">
        <button className={'tabbtn'+(tab==='signals'?' on':'')} onClick={()=>setTab('signals')}>📊 Tín hiệu</button>
        <button className={'tabbtn'+(tab==='learn'?' on':'')} onClick={()=>{setTab('learn');window.scrollTo(0,0);}}>📚 Học</button>
      </div>

      {tab==='learn' && <LearnTab/>}

      {tab==='signals' && <React.Fragment>
      {err && <div className="err">{err}</div>}

      {/* ĐÈN TỔNG */}
      <div className="card meter">
        <div className={'lamp '+(loading?'gray':result.color)}>
          {loading?'…':(result.color==='green'?'🟢':result.color==='yellow'?'🟡':'🔴')}
        </div>
        <div className="level">{loading?'Đang tính…':('Mức thận trọng: '+result.level)}</div>
        <div className="guide">{loading?'Đang lấy dữ liệu thị trường.':result.guide}</div>
        {!loading && <div className="scorebar">
          <i style={{width:Math.min(result.score,MAX_SCORE)/MAX_SCORE*100+'%',background:barColors[result.color]}}></i>
        </div>}
        {!loading && <div className="hint" style={{marginTop:10}}>Tổng hợp nhanh nhiều tín hiệu (tham khảo, <b>chưa kiểm chứng</b>). Mô hình đã backtest nằm ở thẻ “Regime & xác suất” bên dưới.</div>}
      </div>

      {/* GỢI Ý MUA — NHÀ ĐẦU TƯ DÀI HẠN (DCA điều tiết theo định giá) */}
      {backtest && backtest.core && backtest.core.longterm && backtest.core.longterm.current && (()=>{
        const lt = backtest.core.longterm.current;
        const regime = backtest.core.current ? backtest.core.current.regime : null;
        const sug = dcaSuggestion(lt.pct, regime);
        if(!sug) return null;
        const base = parseFloat(String(dcaBase).replace(/[^\d.]/g,''));
        const suggested = (!isNaN(base) && base>0) ? Math.round(base*sug.mult) : null;
        return <div className="card" style={{border:'1px solid '+sug.color}}>
          <h2>Gợi ý mua — đầu tư dài hạn (DCA)</h2>
          <div className="price-row">
            <span className="price" style={{color:sug.color,fontSize:'26px'}}>{sug.label}</span>
            <span className="chg" style={{color:sug.color,fontWeight:800}}>≈ {sug.mult}× mức định kỳ</span>
          </div>
          <div className="hint" style={{marginTop:6}}>
            Định giá dài hạn đang <b>{sug.zone}</b> (MVRV phân vị {lt.pct!=null?Math.round(lt.pct):'—'}/100).
            {lt.n>0 && <span> Lịch sử vùng này: 1 năm sau chỉ <b>{lt.pctNeg}%</b> số lần giá thấp hơn.</span>}
          </div>

          <div style={{marginTop:12}}>
            <div className="hint" style={{marginBottom:4}}>Số tiền bạn mua định kỳ (mỗi tuần/tháng):</div>
            <input inputMode="numeric" placeholder="vd: 2000000" value={dcaBase}
              onChange={e=>setDcaBase(e.target.value)}
              style={{width:'100%',background:'var(--panel2)',border:'1px solid var(--line)',color:'var(--text)',borderRadius:10,padding:'10px 12px',font:'inherit',fontSize:'15px'}}/>
            {suggested!=null &&
              <div style={{marginTop:10,fontSize:'15px',background:'var(--panel2)',borderRadius:12,padding:'12px 13px'}}>
                Kỳ này cân nhắc mua ≈ <b style={{color:sug.color,fontSize:'18px'}}>{suggested.toLocaleString('vi-VN')}</b>
                <span style={{color:'var(--muted)'}}> (× {sug.mult})</span>
              </div>}
          </div>

          {sug.regNote && <div className="hint" style={{marginTop:10}}>🧭 {sug.regNote}</div>}

          <div className="hint" style={{marginTop:10,lineHeight:1.6}}>
            <b>Cách dùng:</b> vẫn mua <b>đều theo lịch</b> (DCA), chỉ <b>tăng/giảm liều</b> theo định giá — rẻ mua nhiều hơn, đắt mua ít lại. ⚠️ Đây là gợi ý điều tiết dựa trên tiền lệ lịch sử, <b>không phải lệnh mua</b>; đừng dồn hết một lần, chỉ dùng tiền chấp nhận rủi ro. Khung tham chiếu: ~1 năm.
          </div>
        </div>;
      })()}

      {/* GIÁ + EMA */}
      <div className="card">
        <h2>Giá BTC &amp; xu hướng</h2>
        {loading && <div className="skel">Đang tải giá…</div>}
        {!loading && data && <div>
          <div className="price-row">
            <span className="price">{fmtUSD(data.price)}</span>
            {chg!=null && <span className={'chg '+(chg>=0?'up':'down')}>
              {(chg>=0?'▲ +':'▼ ')+chg.toFixed(2)}% <span style={{color:'var(--muted)',fontWeight:400}}>(24h)</span></span>}
          </div>
          <Spark data={data.history}/>
          <div className="emagrid">
            <div className="ema"><div className="k">TB 50 ngày (EMA50)</div><div className="v">{fmtUSD(data.e50)}</div>
              <div className={'rel '+relTag(data.price,data.e50)}>{relTxt(data.price,data.e50)} giá hiện tại</div></div>
            <div className="ema"><div className="k">TB 200 ngày (EMA200)</div><div className="v">{fmtUSD(data.e200)}</div>
              <div className={'rel '+relTag(data.price,data.e200)}>{relTxt(data.price,data.e200)} giá hiện tại</div></div>
          </div>
          {trend && <span className={'trendtag '+(trend==='below_both'?'below':trend==='above_both'?'above':'mixed')}>
            {trend==='below_both'?'Dưới cả 2 đường TB → xu hướng yếu'
              :trend==='above_both'?'Trên cả 2 đường TB → xu hướng tích cực':'Nằm giữa 2 đường TB → giằng co'}</span>}
        </div>}
      </div>

      {/* 3 CHỈ BÁO NHANH */}
      <div className="card">
        <h2>Chỉ báo nhanh</h2>
        <div className="ind3">
          <div className="ind">
            <div className="kk">RSI (14 ngày)</div>
            <div className="vv" style={{color:rsiColor}}>{data&&data.rsi!=null?data.rsi.toFixed(0):'—'}</div>
            <div className="tt" style={{color:rsiColor}}>{rsiTxt}</div>
            {data&&data.rsi!=null && <div className="gauge"><i style={{left:Math.max(0,Math.min(100,data.rsi))+'%'}}></i></div>}
          </div>
          <div className="ind">
            <div className="kk">Sợ hãi &amp; Tham lam</div>
            <div className="vv" style={{color:fngColor}}>{fng?fng.value:'—'}</div>
            <div className="tt" style={{color:fngColor}}>{fng?fngLabel(fng.value):''}</div>
            {fng && <div className="gauge"><i style={{left:Math.max(0,Math.min(100,fng.value))+'%'}}></i></div>}
          </div>
          <div className="ind">
            <div className="kk">Funding /8h</div>
            <div className="vv" style={{color:fundColor,fontSize:'18px'}}>{fundPct!=null?fundPct.toFixed(3)+'%':'—'}</div>
            <div className="tt" style={{color:fundColor}}>{funding?(funding.rate>=0.0005?'Long nóng':funding.rate<0?'Long yếu':'Bình thường'):''}</div>
          </div>
        </div>
        <div className="hint">RSI &gt;70 = quá mua (dễ chỉnh) · &lt;30 = quá bán. Sợ hãi/Tham lam: 0 = sợ tột độ, 100 = tham lam tột độ. Funding cao = phe long đông, dễ bị đè.</div>
      </div>

      {/* ON-CHAIN MVRV */}
      {mvrv!=null && <div className="card">
        <h2>On-chain — MVRV Z-score</h2>
        <div className="price-row">
          <span className="price" style={{color: mvrv>=7?'var(--red)':mvrv>=5?'var(--yellow)':mvrv<0.1?'var(--green)':'var(--text)'}}>{mvrv.toFixed(2)}</span>
          <span className="chg" style={{color:'var(--muted)',fontWeight:600}}>
            {mvrv>=7?'Vùng đỉnh lịch sử':mvrv>=5?'Định giá nóng':mvrv<0.1?'Vùng đáy — cơ hội gom':'Trung tính'}</span>
        </div>
        <div className="hint">So sánh giá với "giá vốn trung bình toàn mạng". Trong quá khứ: &gt;7 thường là vùng đỉnh (bán), &lt;0 là vùng đáy (gom). Nguồn: bitcoin-data.com.</div>
      </div>}

      {/* MACRO */}
      {macro && <div className="card">
        <h2>Vĩ mô (FRED)</h2>
        <div className="ind3">
          <div className="ind">
            <div className="kk">Chỉ số Đô la</div>
            <div className="vv" style={{fontSize:'18px'}}>{macro.dxy?macro.dxy.value:'—'}</div>
            <div className="tt" style={{color: macro.dxy&&macro.dxy.trend==='up'?'var(--red)':'var(--green)'}}>
              {macro.dxy?(macro.dxy.trend==='up'?'▲ mạnh lên':'▼ yếu đi'):''}</div>
          </div>
          <div className="ind">
            <div className="kk">Lợi suất 10Y</div>
            <div className="vv" style={{fontSize:'18px'}}>{macro.us10y?macro.us10y.value+'%':'—'}</div>
            <div className="tt" style={{color: macro.us10y&&macro.us10y.trend==='up'?'var(--red)':'var(--green)'}}>
              {macro.us10y?(macro.us10y.trend==='up'?'▲ tăng':'▼ giảm'):''}</div>
          </div>
          <div className="ind">
            <div className="kk">Cung tiền M2</div>
            <div className="vv" style={{fontSize:'18px'}}>{macro.m2?macro.m2.trend==='up'?'Nới':'Co':'—'}</div>
            <div className="tt" style={{color: macro.m2&&macro.m2.trend==='up'?'var(--green)':'var(--red)'}}>
              {macro.m2?(macro.m2.trend==='up'?'▲ thanh khoản ↑':'▼ thanh khoản ↓'):''}</div>
          </div>
        </div>
        <div className="hint">Đô mạnh + lợi suất tăng + M2 co = môi trường siết tiền, bất lợi cho BTC. Ngược lại là thuận lợi.</div>
      </div>}

      {/* FED */}
      <div className="card">
        <h2>Đếm ngược cuộc họp Fed (FOMC)</h2>
        {fomc ? <div>
          <div className="fed-days">{fomc.days} <small>ngày nữa</small></div>
          <div className="hint">{fomc.meeting.label} — ngày {fomc.meeting.date.split('-').reverse().join('/')}. Quanh ngày này giá thường biến động mạnh, khó đoán hướng.</div>
        </div> : <div className="skel">Chưa có lịch họp sắp tới trong dữ liệu.</div>}
      </div>

      {/* ETF */}
      <div className="card">
        <h2>Dòng tiền ETF</h2>
        {etfData && <div className="auto">
          <b>Tự động</b><span className="badge">AUTO</span><br/>
          Ngày {etfData.latestDate}: dòng ròng <b style={{color:etfData.latestNetFlow<0?'var(--red)':'var(--green)'}}>
            {etfData.latestNetFlow<0?'':'+'}{etfData.latestNetFlow} triệu $</b>
          {etfData.outflowStreak>=2 && <span> · đang rút ròng <b>{etfData.outflowStreak}</b> phiên liền</span>}
          <div className="hint">Nguồn Farside (tự cập nhật). Nếu bạn có tin mới hơn, dùng công tắc dưới để ghi đè.</div>
        </div>}
        <div className="switch-row" style={{marginTop:etfData?12:0}}>
          <div><b>{etfData?'Ghi đè tay: đang rút ra':'ETF đang rút ra?'}</b>
            <div className="hint">Bật khi bạn đọc tin các quỹ ETF bán ròng nhiều phiên liền.</div></div>
          <label className="switch"><input type="checkbox" checked={etfManual} onChange={e=>setEtfManual(e.target.checked)}/><span className="slider"></span></label>
        </div>
        <textarea placeholder="Ghi chú (vd: rút ròng 3 phiên liền, ~-500 triệu $)…" value={etfNote} onChange={e=>setEtfNote(e.target.value)}/>
      </div>

      {/* MSTR */}
      <div className="card">
        <h2>MicroStrategy (Strategy)</h2>
        {mstrData && mstrData.latest8K && <div className="auto">
          <b>Filing gần nhất</b><span className="badge">AUTO</span><br/>
          8-K ngày {mstrData.latest8K.date} — <a href={mstrData.latest8K.url} target="_blank" rel="noopener">xem trên SEC ↗</a>
          <div className="hint">App không tự đoán mua hay bán — bạn mở filing xem, nếu là bán lớn thì bật công tắc dưới.</div>
        </div>}
        <div className="switch-row" style={{marginTop:mstrData&&mstrData.latest8K?12:0}}>
          <div><b>Vừa bán lớn / bất thường?</b>
            <div className="hint">Bật khi có tin họ bán ra lượng BTC đáng kể (họ vốn hầu như chỉ mua).</div></div>
          <label className="switch"><input type="checkbox" checked={mstr} onChange={e=>setMstr(e.target.checked)}/><span className="slider"></span></label>
        </div>
        <textarea placeholder="Ghi chú (vd: bán ~216 triệu $ — cần xác minh nguồn)…" value={mstrNote} onChange={e=>setMstrNote(e.target.value)}/>
      </div>

      {/* PHÂN TÍCH */}
      <div className="card">
        <h2>Các tín hiệu đang tính ({result.score}/{MAX_SCORE} điểm thận trọng)</h2>
        {result.factors.length===0 && <div className="skel">Chưa có tín hiệu nào.</div>}
        {result.factors.map((f,i)=>(
          <div className="factor" key={i}>
            <span className="dot" style={{background:f.c==='red'?'var(--red)':f.c==='yellow'?'var(--yellow)':'var(--green)'}}></span>
            <div className="ftext"><div className="fl">{f.l}</div><div className="fd">{f.d}</div></div>
            <div className="fw">{f.w>0?('+'+f.w):'0'}</div>
          </div>
        ))}
      </div>

      {/* RỦI RO ĐỊNH GIÁ — mô hình đã kiểm chứng (backtest đa năm) */}
      {backtest && backtest.core && backtest.core.model==='regime-primary' && (()=>{
        const core = backtest.core;
        const rg = core.regime || {};
        const regime = (data && data.e200!=null && data.price!=null) ? (data.price>data.e200?'bull':'bear') : null;
        const src = core.validated ? (rg.outSample||{}) : (rg.all||{});
        const cur = regime ? src[regime] : null;
        const bAll = (rg.all||{}).bull, beAll = (rg.all||{}).bear;
        const cov = backtest.coverage || {};
        const lr = liveRisk(core, data?data.price:null, data?data.e200:null, data?data.rsi:null, mvrv, fng?fng.value:null);
        const risk = lr ? lr.risk : null;
        const rColor = regime==='bull'?'var(--green)':regime==='bear'?'var(--red)':'var(--muted)';
        const bias = regime==='bull'?'Nghiêng THUẬN LỢI — bull thường tiếp diễn, có thể mua mạnh tay hơn (vẫn chia nhỏ).'
                    :regime==='bear'?'Nghiêng THẬN TRỌNG — bear hay kéo dài & rủi ro giảm cao, ưu tiên chia nhỏ, giữ tiền mặt.':'';
        return <div className="card">
          <h2>Regime & xác suất (mô hình đã kiểm chứng)</h2>
          <div className="price-row">
            <span className="price" style={{color:rColor}}>{regime==='bull'?'TĂNG (Bull)':regime==='bear'?'GIẢM (Bear)':'—'}</span>
            <span className="badge" style={core.validated?{background:'rgba(46,199,122,.18)',color:'#7fe6ab'}:{background:'rgba(242,193,78,.18)',color:'#ffd97a'}}>
              {core.validated?'✓ ĐÃ KIỂM CHỨNG OOS':'⚠ CHƯA ĐẠT KIỂM CHỨNG'}</span>
          </div>
          <div className="hint" style={{marginTop:4}}>Giá {regime==='bull'?'trên':regime==='bear'?'dưới':'so'} đường trung bình 200 ngày (EMA200). {bias}</div>
          {cur && cur.n>0 &&
            <div style={{fontSize:'14px',lineHeight:1.6,background:'var(--panel2)',borderRadius:12,padding:'12px 13px',marginTop:10}}>
              Lịch sử: {cur.n} lần ở regime này, sau {cov.horizonDays||90} ngày <b>TB {cur.avgFwd>=0?'+':''}{cur.avgFwd}%</b>, <b>{cur.pctNeg}%</b> số lần giá thấp hơn. {core.validated?'(out-of-sample)':'(toàn bộ lịch sử)'}
            </div>}
          {bAll && beAll && <div style={{marginTop:8}}>
            <div className="factor" style={regime==='bull'?{background:'rgba(46,199,122,.07)',borderRadius:8}:null}>
              <span className="dot" style={{background:'var(--green)'}}></span>
              <div className="ftext"><div className="fl">Bull (giá trên EMA200) {regime==='bull'?'← hiện tại':''}</div>
                <div className="fd">{bAll.n} lần · 90 ngày sau TB +{bAll.avgFwd}% · {bAll.pctNeg}% số lần giảm</div></div>
            </div>
            <div className="factor" style={regime==='bear'?{background:'rgba(239,83,80,.07)',borderRadius:8}:null}>
              <span className="dot" style={{background:'var(--red)'}}></span>
              <div className="ftext"><div className="fl">Bear (giá dưới EMA200) {regime==='bear'?'← hiện tại':''}</div>
                <div className="fd">{beAll.n} lần · 90 ngày sau TB +{beAll.avgFwd}% · {beAll.pctNeg}% số lần giảm</div></div>
            </div>
          </div>}

          {risk!=null && <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid var(--line)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
              <b style={{fontSize:'13px'}}>Nhiệt kế định giá</b>
              <span style={{fontWeight:800,fontSize:'18px'}}>{risk.toFixed(0)}<span style={{fontSize:'13px',color:'var(--muted)'}}>/100</span></span>
            </div>
            <div className="gauge" style={{marginTop:8,background:'linear-gradient(90deg,#3a6fb0,#8a94ab,#c8302c)'}}><i style={{left:Math.max(0,Math.min(100,risk))+'%'}}></i></div>
            {lr && lr.parts.length>0 && <div style={{marginTop:8}}>
              {lr.parts.map((p,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'1px 0'}}>
                  <span style={{color:'var(--muted)'}}>{COMP_VI[p.k]||p.k}</span>
                  <span style={{fontWeight:700}}>{p.p.toFixed(0)}<span style={{color:'var(--muted)',fontWeight:400}}>/100</span></span>
                </div>
              ))}
            </div>}
            <div className="hint" style={{marginTop:6}}>0 = rẻ/sợ hãi · 100 = đắt/hưng phấn. ⚠️ Chỉ là bối cảnh: ở khung 90 ngày chỉ số này <b>KHÔNG</b> báo giảm (momentum lấn át) — hữu ích hơn cho khung dài.</div>
          </div>}

          <div className="hint" style={{marginTop:10}}>
            {cov.from && ('Backtest '+cov.from+' → '+cov.to+' ('+cov.days+' ngày). ')}
            Tín hiệu chính = regime (giá vs EMA200), chọn/kiểm chứng in-sample {cov.trainDays||'?'} / out-of-sample {cov.testDays||'?'} ngày. Quá khứ không đảm bảo tương lai.
          </div>
        </div>;
      })()}

      {/* ĐỊNH GIÁ DÀI HẠN (~1 năm) — MVRV */}
      {backtest && backtest.core && backtest.core.longterm && backtest.core.longterm.current && (()=>{
        const lt = backtest.core.longterm;
        const cur = lt.current;
        const tcolor = cur.tier ? TIER_COLOR[cur.tier] : 'var(--muted)';
        const tierBuy = {'Thoang':'RẺ — vùng gom','Can chu y':'Trung tính','Rat than trong':'ĐẮT — thận trọng'};
        const arr = lt.validated ? lt.outSample : lt.all;
        return <div className="card">
          <h2>Định giá dài hạn ~1 năm (MVRV)</h2>
          <div className="price-row">
            <span className="price" style={{color:tcolor}}>{cur.pct!=null?Math.round(cur.pct):'—'}<span style={{fontSize:'16px',color:'var(--muted)'}}>/100</span></span>
            <span className="chg" style={{color:tcolor,fontWeight:700}}>{cur.tier?tierBuy[cur.tier]:'—'}</span>
            <span className="badge" style={lt.validated?{background:'rgba(46,199,122,.18)',color:'#7fe6ab'}:{background:'rgba(242,193,78,.18)',color:'#ffd97a'}}>
              {lt.validated?'✓ ĐÃ KIỂM CHỨNG OOS':'⚠ CHƯA ĐẠT KIỂM CHỨNG'}</span>
          </div>
          <div className="gauge" style={{marginTop:12,background:'linear-gradient(90deg,var(--green),var(--yellow),var(--red))'}}><i style={{left:Math.max(0,Math.min(100,cur.pct||0))+'%'}}></i></div>
          <div className="hint" style={{marginTop:6}}>MVRV hiện tại {cur.mvrv} (phân vị {cur.pct!=null?Math.round(cur.pct):'—'}/100). 0 = rẻ (gom) · 100 = đắt (đỉnh chu kỳ).</div>
          {cur.n>0 && <div style={{fontSize:'14px',lineHeight:1.6,background:'var(--panel2)',borderRadius:12,padding:'12px 13px',marginTop:10}}>
            Lịch sử: {cur.n} lần định giá tương tự, <b>1 năm sau TB {cur.avgFwd>=0?'+':''}{cur.avgFwd}%</b>, {cur.pctNeg}% số lần giá thấp hơn. {lt.validated?'(out-of-sample)':'(toàn bộ lịch sử)'}
          </div>}
          {arr && <div style={{marginTop:8}}>
            {arr.map((t,i)=>(
              <div className="factor" key={i} style={t.tier===cur.tier?{background:'rgba(247,147,26,.07)',borderRadius:8}:null}>
                <span className="dot" style={{background:TIER_COLOR[t.tier]}}></span>
                <div className="ftext"><div className="fl">{tierBuy[t.tier]} {t.tier===cur.tier?'← hiện tại':''}</div>
                  <div className="fd">{t.n>0?(t.n+' lần · 1 năm sau TB '+(t.avgFwd>=0?'+':'')+t.avgFwd+'% · '+t.pctNeg+'% số lần giảm'):'chưa đủ dữ liệu'}</div></div>
              </div>
            ))}
          </div>}
          <div className="hint" style={{marginTop:10}}>MVRV = giá / giá vốn trung bình toàn mạng (Coin Metrics, lịch sử sâu). Đây là khung <b>1 năm</b> — bổ trợ cho regime (90 ngày) ở trên. Quá khứ không đảm bảo tương lai.</div>
        </div>;
      })()}

      {/* TIỀN LỆ TỚI ĐÁY */}
      {backtest && backtest.core && backtest.core.bottomAnalog && (()=>{
        const b = backtest.core.bottomAnalog;
        const dd = b.drawdown, wk = b.weeks;
        const wkMonths = (w)=> (w/4.33).toFixed(w>=8?0:1);
        return <div className="card">
          <h2>Tiền lệ tới đáy (tham khảo — KHÔNG phải dự báo)</h2>
          <div className="hint" style={{marginBottom:10}}>
            Lọc <b>{b.nAnalogs}</b> lần trong lịch sử có bối cảnh giống hiện tại
            (regime <b>{b.setup.regime==='bear'?'giảm':'tăng'}</b> + định giá phân vị ~{Math.round(b.setup.valPct)}),
            xem sau đó giá còn giảm thêm bao nhiêu & mất bao lâu tới đáy (trong ~{Math.round(b.window/30)} tháng).
          </div>

          <div className="emagrid">
            <div className="ema">
              <div className="k">Thường còn giảm thêm</div>
              <div className="v" style={{color: dd.median<-3?'var(--red)':'var(--green)'}}>{dd.median}%</div>
              <div className="rel" style={{color:'var(--muted)'}}>khoảng {dd.deep}% … {dd.shallow}%</div>
            </div>
            <div className="ema">
              <div className="k">Thời gian tới đáy</div>
              <div className="v" style={{color:'var(--blue)'}}>{wk.median} tuần</div>
              <div className="rel" style={{color:'var(--muted)'}}>khoảng {wk.soon} … {wk.late} tuần (~{wkMonths(wk.soon)}–{wkMonths(wk.late)} tháng)</div>
            </div>
          </div>

          <div style={{fontSize:'14px',lineHeight:1.6,background:'var(--panel2)',borderRadius:12,padding:'12px 13px',marginTop:12}}>
            <b>{b.pctNearBottom}%</b> số lần tương tự gần như <b>đã ở đáy</b> (không giảm thêm quá 3%).
            {dd.median>-3
              ? <span> Đa số tiền lệ cho thấy vùng này thường <b>gần đáy</b>.</span>
              : <span> Nghĩa là vẫn còn khả năng giảm thêm trước khi tạo đáy.</span>}
          </div>

          <div className="hint" style={{marginTop:10,lineHeight:1.6}}>
            ⚠️ Đây là <b>thống kê tiền lệ</b>, KHÔNG phải dự báo — lần này có thể khác hoàn toàn. Khoảng rộng chính là <b>độ bất định</b>: không ai biết đáy chính xác ở đâu hay khi nào. Dùng để chuẩn bị tâm lý & chia lệnh, không dùng để canh mua đúng đáy.
          </div>
        </div>;
      })()}

      {/* THÔNG BÁO */}
      <div className="card">
        <h2>Thông báo</h2>
        <button className={'btn'+(notify?' on':'')} onClick={toggleNotify}>
          {notify?'🔔 Thông báo đang BẬT — bấm để tắt':'🔕 Bật thông báo'}
        </button>

        {notify && <div style={{marginTop:6}}>
          {[
            ['red','Mức thận trọng đỏ','Khi đèn tổng chuyển 🔴'],
            ['cheap','Định giá rẻ (vùng gom)','Khi MVRV dài hạn vào vùng rẻ — gợi ý tăng mua'],
            ['regime','Đổi xu hướng (regime)','Khi giá vượt/thủng EMA200 (bull ↔ bear)'],
            ['fed','Sát ngày họp Fed','Khi còn ≤ 2 ngày tới FOMC'],
            ['dca','Nhắc lịch mua định kỳ (DCA)','Nhắc đến kỳ mua theo tần suất bạn chọn'],
          ].map(([k,label,desc])=>(
            <div className="switch-row" key={k} style={{marginTop:12}}>
              <div><b>{label}</b><div className="hint">{desc}</div></div>
              <label className="switch"><input type="checkbox" checked={!!noti[k]} onChange={e=>setNoti(Object.assign({},noti,{[k]:e.target.checked}))}/><span className="slider"></span></label>
            </div>
          ))}
          {noti.dca && <div className="switch-row" style={{marginTop:12}}>
            <div><b>Tần suất DCA</b><div className="hint">Chu kỳ nhắc mua</div></div>
            <select value={noti.dcaFreq} onChange={e=>setNoti(Object.assign({},noti,{dcaFreq:parseInt(e.target.value,10)}))}
              style={{background:'var(--panel2)',border:'1px solid var(--line)',color:'var(--text)',borderRadius:10,padding:'8px 10px',font:'inherit',fontSize:'14px'}}>
              <option value={7}>Hằng tuần</option>
              <option value={14}>2 tuần</option>
              <option value={30}>Hằng tháng</option>
            </select>
          </div>}
        </div>}

        <div className="hint" style={{marginTop:12}}>⚠️ Giới hạn: app tĩnh chỉ nhắc được <b>khi bạn mở app</b> (mỗi loại tối đa 1 lần/ngày) — trình duyệt không cho chạy ngầm khi đã đóng hẳn. Cài app ra màn hình chính (PWA) để mở nhanh & nhận nhắc thường xuyên hơn.</div>
      </div>

      {updatedAt && <div className="updated">
        Dữ liệu giá: {data && data.live?'trực tiếp (CoinGecko)':'dự phòng'} · cập nhật {updatedAt.toLocaleString('vi-VN')}</div>}
      <div className="disclaimer">
        ⚠️ Công cụ tổng hợp tín hiệu để tham khảo, <b>không phải lời khuyên đầu tư</b>.
        Không tín hiệu nào đảm bảo giá sẽ lên hay xuống. Tự chịu trách nhiệm với quyết định của mình,
        chỉ dùng tiền bạn sẵn sàng chấp nhận rủi ro.
      </div>
      </React.Fragment>}
    </div>
  );
}

/* ---------- TAB HỌC: từ điển thuật ngữ + kiến thức đầu tư BTC ---------- */
function LC({q, children}){
  const [open, setOpen] = useState(false);
  return (
    <div className="lc">
      <button className="lc-q" onClick={()=>setOpen(!open)}>
        <span>{q}</span><span className="lc-ar">{open?'−':'+'}</span>
      </button>
      {open && <div className="lc-a">{children}</div>}
    </div>
  );
}
function LearnTab(){
  return (
    <div>
      <div className="card" style={{background:'linear-gradient(135deg,rgba(247,147,26,.12),rgba(91,157,255,.08))'}}>
        <h2 style={{color:'var(--orange)'}}>Học đầu tư BTC từ đầu</h2>
        <div style={{fontSize:'14px',lineHeight:1.6}}>Bấm vào từng mục để mở giải thích. Sắp xếp từ dễ tới khó, gắn với đúng những gì hiển thị trong app. Đọc dần, không cần thuộc hết.</div>
      </div>

      <div className="card">
        <h2>1 · Nền tảng Bitcoin</h2>
        <LC q="Bitcoin (BTC) là gì?">Tiền mã hoá đầu tiên, ra đời 2009. Là "tiền số" chạy trên một mạng máy tính phân tán, <b>không do ngân hàng hay chính phủ nào phát hành</b>. Tổng cung giới hạn <b>21 triệu</b> BTC — không ai in thêm được, nên nhiều người coi là "vàng số" chống mất giá.</LC>
        <LC q="Blockchain (chuỗi khối)">Cuốn sổ cái ghi mọi giao dịch, được hàng nghìn máy tính khắp thế giới cùng giữ và kiểm tra. Đã ghi thì <b>không sửa/xoá được</b>. Nhờ vậy không cần "bên trung gian" tin cậy.</LC>
        <LC q="Ví (wallet) & khoá riêng (private key)">Ví là nơi giữ BTC của bạn. <b>Khoá riêng</b> (hoặc 12–24 từ khôi phục "seed phrase") là mật khẩu tối thượng — <b>ai có nó thì sở hữu số BTC đó</b>. Mất khoá = mất tiền, không ai lấy lại được. TUYỆT ĐỐI không chụp màn hình, không gửi cho ai.</LC>
        <LC q="Sàn giao dịch (exchange)">Nơi mua/bán BTC bằng tiền thường (Binance, Coinbase, OKX…). Tiện nhưng "tiền để trên sàn = sàn giữ hộ" — sàn sập/bị hack thì rủi ro. Câu nói kinh điển: <b>"Not your keys, not your coins"</b> (không phải khoá của bạn thì không phải coin của bạn).</LC>
        <LC q="Tự lưu ký (self-custody)">Rút BTC về ví riêng bạn tự giữ khoá (ví cứng như Ledger/Trezor là an toàn nhất). Dài hạn nên học cái này để không phụ thuộc sàn.</LC>
        <LC q="Satoshi (sat)">Đơn vị nhỏ nhất của BTC. 1 BTC = 100 triệu sat. Mua "0,01 BTC" là chuyện bình thường — không cần mua nguyên 1 đồng.</LC>
      </div>

      <div className="card">
        <h2>2 · Thuật ngữ giá & xu hướng (trong app)</h2>
        <LC q="EMA50 / EMA200 (đường trung bình)">"Giá trung bình" của BTC trong 50 (hoặc 200) ngày gần nhất, làm mượt để thấy xu hướng. Giá <b>trên</b> đường TB = xu hướng khoẻ; <b>dưới</b> = yếu. EMA200 là mốc dài hạn quan trọng nhất.</LC>
        <LC q="Regime (bull / bear)">App định nghĩa: giá <b>trên</b> EMA200 = <b>Bull (tăng)</b>; <b>dưới</b> = <b>Bear (giảm)</b>. Backtest 10 năm cho thấy đây là tín hiệu sạch nhất: bull 90 ngày sau thường +30% (33% số lần giảm), bear +8% (54% giảm).</LC>
        <LC q="RSI (chỉ số sức mạnh tương đối)">Đo giá tăng "nóng" hay giảm "quá đà", thang 0–100. <b>&gt;70 = quá mua</b> (dễ điều chỉnh), <b>&lt;30 = quá bán</b> (đã giảm sâu). Không dùng một mình để mua/bán.</LC>
        <LC q="Xu hướng ngắn/trung/dài hạn">Ngắn (ngày–tuần), trung (tuần–tháng), dài (tháng–năm). Cùng một tín hiệu có thể khác nghĩa ở mỗi khung — vì thế app tách riêng "regime 90 ngày" và "định giá 1 năm".</LC>
        <LC q="ATH / ATL">All-Time High / Low = đỉnh / đáy cao/thấp nhất mọi thời đại.</LC>
      </div>

      <div className="card">
        <h2>3 · Tâm lý & phái sinh</h2>
        <LC q="Fear & Greed Index (Sợ hãi & Tham lam)">Chỉ số tâm lý đám đông 0–100. <b>0 = sợ tột độ</b> (thường là lúc mua tốt), <b>100 = tham lam tột độ</b> (dễ điều chỉnh). "Hãy tham lam khi người khác sợ hãi."</LC>
        <LC q="Funding rate (phí đòn bẩy)">Trên thị trường hợp đồng tương lai, phe Long (đặt cược giá lên) và Short (giá xuống) trả phí cho nhau mỗi 8 giờ. <b>Funding cao</b> = phe Long quá đông/đòn bẩy nóng → dễ bị "long squeeze" (rớt nhanh khi họ bị thanh lý hàng loạt).</LC>
        <LC q="Long / Short / Đòn bẩy (leverage)">Long = đặt cược giá LÊN; Short = giá XUỐNG. Đòn bẩy = vay để cược lớn hơn vốn (x5, x10…) — <b>lãi to nhưng cháy tài khoản cực nhanh</b>. Người mới & đầu tư dài hạn KHÔNG nên đụng đòn bẩy.</LC>
        <LC q="Open Interest (OI)">Tổng số hợp đồng phái sinh đang mở — đo mức độ đòn bẩy toàn thị trường. OI tăng nóng + funding cao = thị trường "căng", dễ biến động mạnh.</LC>
      </div>

      <div className="card">
        <h2>4 · On-chain & định giá</h2>
        <LC q="MVRV (Z-score)">So sánh <b>giá hiện tại</b> với <b>giá vốn trung bình toàn mạng</b> (giá mà mọi người đã mua vào). MVRV cao = phần đông đang lãi đậm → vùng đắt/đỉnh. MVRV thấp/quanh 1 = rẻ → vùng đáy. App dùng nó cho tín hiệu <b>dài hạn 1 năm</b>.</LC>
        <LC q="Realized Price (giá vốn thật)">Giá vốn trung bình của toàn mạng — như "giá hoà vốn" của cả thị trường. Thường là mốc hỗ trợ mạnh ở đáy chu kỳ.</LC>
        <LC q="Exchange netflow (dòng vào/ra sàn)">BTC chảy VÀO sàn nhiều = có thể sắp bán (áp lực giảm); RÚT RA khỏi sàn = tích trữ dài hạn (tín hiệu tốt). Nguồn free khó lấy nên app chưa tự động phần này.</LC>
        <LC q="Halving (giảm nửa phần thưởng)">Mỗi ~4 năm, phần thưởng đào BTC giảm một nửa → nguồn cung mới ít đi. Lịch sử các chu kỳ tăng lớn thường theo sau halving (không đảm bảo lặp lại).</LC>
      </div>

      <div className="card">
        <h2>5 · Kinh tế vĩ mô ảnh hưởng BTC</h2>
        <LC q="Fed & FOMC (cuộc họp lãi suất Mỹ)">Fed = ngân hàng trung ương Mỹ; FOMC = cuộc họp quyết định lãi suất (8 lần/năm). Quanh ngày họp, mọi tài sản rủi ro — kể cả BTC — <b>biến động mạnh, khó đoán hướng</b>.</LC>
        <LC q="Lãi suất & thanh khoản">Lãi suất cao / hút tiền về = ít tiền rẻ chảy vào tài sản rủi ro → bất lợi cho BTC. Lãi suất giảm / bơm tiền = thuận lợi.</LC>
        <LC q="Chỉ số Đô la (DXY) & lợi suất 10 năm">Đô mạnh lên hoặc lợi suất trái phiếu tăng = thường đè giá BTC. App theo dõi qua thẻ "Vĩ mô (FRED)".</LC>
        <LC q="Cung tiền M2">Tổng lượng tiền trong nền kinh tế. M2 nới rộng (bơm tiền) thường đi cùng tài sản rủi ro tăng; M2 co lại = siết.</LC>
        <LC q="ETF Bitcoin giao ngay">Quỹ niêm yết trên sàn chứng khoán, gom tiền nhà đầu tư đi mua BTC thật. ETF <b>mua ròng</b> = lực đỡ giá; <b>bán ròng/rút</b> = thiếu lực mua. Là kênh tiền lớn (tổ chức) vào BTC.</LC>
        <LC q="MicroStrategy (Strategy)">Công ty nổi tiếng gom mua BTC khổng lồ, gần như không bán. Khi họ mua/bán bất thường → tín hiệu đáng chú ý về tâm lý "tay to".</LC>
      </div>

      <div className="card">
        <h2>6 · Chiến lược cho người dài hạn</h2>
        <LC q="DCA (mua trung bình giá)">Chia tiền mua <b>đều đặn</b> theo lịch (vd mỗi tuần/tháng một ít) thay vì dồn một lần. Giúp không phải đoán đáy, giảm rủi ro mua trúng đỉnh. <b>Chiến lược an toàn nhất cho người mới & dài hạn.</b></LC>
        <LC q="DCA điều tiết theo định giá (app này gợi ý)">Vẫn DCA đều, nhưng <b>rẻ thì mua nhiều hơn, đắt thì mua ít lại</b> — dựa trên MVRV. Thẻ "Gợi ý mua" cho hệ số ×0.3 đến ×2 mức định kỳ.</LC>
        <LC q="Quản trị rủi ro (position sizing)">Chỉ dùng <b>tiền nhàn rỗi, sẵn sàng mất</b>. Không vay mượn, không all-in. Quy tắc phổ biến: chỉ để một tỷ trọng nhỏ danh mục vào crypto tuỳ khẩu vị rủi ro.</LC>
        <LC q="HODL">Từ lóng của "hold" — mua và <b>giữ dài hạn</b>, không bán theo biến động ngắn. Hợp với người tin vào BTC nhiều năm.</LC>
        <LC q="Chốt lời & tái cân bằng">Có kế hoạch bán bớt khi lãi lớn / định giá quá cao (MVRV cao), đưa danh mục về tỷ trọng mục tiêu. Tránh lòng tham giữ tới khi sập.</LC>
      </div>

      <div className="card">
        <h2>7 · Kiến thức về app & backtest</h2>
        <LC q="Backtest là gì?">Lấy công thức/luật đem thử ngược lại quá khứ để xem "nếu áp dụng hồi đó thì đúng không". Biến app từ cảm tính thành có kiểm chứng bằng số liệu thật.</LC>
        <LC q="Out-of-sample (OOS) & overfit">Chọn luật trên một đoạn lịch sử, rồi <b>kiểm chứng trên đoạn KHÁC chưa dùng</b>. Nếu vẫn đúng = đáng tin. Overfit = chỉnh luật khớp hoàn hảo quá khứ nhưng ra tương lai lại trật — cạm bẫy lớn nhất.</LC>
        <LC q="Percentile (phân vị)">Xếp hạng một giá trị so với lịch sử của chính nó. "MVRV phân vị 17/100" = hiện rẻ hơn 83% thời gian trong quá khứ.</LC>
        <LC q='"Tiền lệ tới đáy" nghĩa là gì?'>Thống kê: các lần quá khứ có bối cảnh GIỐNG hiện tại thì sau đó giá còn giảm thêm bao nhiêu & mất bao lâu tới đáy. Là <b>tiền lệ, KHÔNG phải dự báo</b> — khoảng rộng = độ bất định.</LC>
        <LC q="Vì sao không đoán được đáy/đỉnh chính xác?">Giá phụ thuộc vô số yếu tố không biết trước (Fed, biến cố, dòng tiền). Mọi công cụ chỉ cho <b>xác suất theo tiền lệ</b>, không phải điểm chính xác. Ai hứa "chắc chắn" là đang lừa.</LC>
      </div>

      <div className="card">
        <h2>8 · Cạm bẫy & an toàn</h2>
        <LC q="FOMO & FUD">FOMO = sợ bỏ lỡ → mua đuổi lúc giá đã cao. FUD = tin sợ hãi → bán tháo lúc đáy. Hai kẻ thù lớn nhất của nhà đầu tư. Có kế hoạch (DCA) để không bị cảm xúc dắt mũi.</LC>
        <LC q="Lừa đảo thường gặp">Hứa "lãi cố định/x2 tài khoản", airdrop giả, mạo danh sàn/người nổi tiếng, link lạ xin seed phrase. <b>Không ai cho tiền miễn phí.</b> Không bao giờ nhập 12 từ khôi phục vào website.</LC>
        <LC q="Stablecoin (USDT/USDC)">Tiền số neo giá 1 USD, dùng để "đứng ngoài" khi chưa muốn giữ BTC. Tiện nhưng vẫn có rủi ro nhà phát hành — chọn loại uy tín.</LC>
        <LC q="Altcoin & rủi ro">Các coin khác ngoài BTC. Biến động mạnh hơn, rủi ro cao hơn nhiều, phần lớn về 0 theo thời gian. Người mới nên tập trung BTC trước.</LC>
        <LC q="Thuế & pháp lý">Tuỳ quốc gia, lãi từ crypto có thể phải khai thuế. Tự tìm hiểu quy định nơi bạn ở.</LC>
      </div>

      <div className="card" style={{textAlign:'center'}}>
        <div style={{fontSize:'13px',color:'var(--muted)',lineHeight:1.6}}>
          Nội dung mang tính giáo dục, <b>không phải lời khuyên đầu tư</b>.<br/>Bấm “📊 Tín hiệu” ở trên để quay lại bảng theo dõi.
        </div>
      </div>
    </div>
  );
